# Blueprint de Render: backend. La base de datos NO va aqui: esta en MongoDB Atlas.
# MONGODB_URI se pone a mano en el panel de Render (sync: false). Nunca subirla al repositorio.
services:
  - type: web
    name: alertabarrio-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: http://localhost:8000
      - key: SEED_ON_STARTUP
        value: "true"
      - key: TIMEZONE
        value: America/Bogota
      - key: PROFESOR_PASSWORD
        sync: false

