name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ───────────────────────────── Backend + MongoDB real
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongodb:
        image: mongo:7.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MONGODB_URI: mongodb://localhost:27017/alertabarrio_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Pruebas (estructuras + API contra MongoDB 7)
        run: pytest -q

  # ───────────────────────────── Imagenes Docker
  docker:
    needs: [backend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen de ${{ matrix.service }}
        run: docker build -t alertabarrio-${{ matrix.service }} ./${{ matrix.service }}

  # ───────────────────────────── Despliegue en Render (si hay deploy hooks)
  deploy:
    needs: docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar backend en Render
        env:
          BACKEND_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: |
          [ -n "$BACKEND_HOOK" ] && curl -fsS -X POST "$BACKEND_HOOK" || echo "Sin RENDER_DEPLOY_HOOK_BACKEND, se omite"
